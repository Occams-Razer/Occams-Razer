<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t">
  <title id="t">Case file: Max Kirchstein. Status: open.</title>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #111; }
    .label { font-size: 13px; letter-spacing: .1em; fill: #77736b; }
    .value { font-size: 19px; font-weight: 700; }
    .name { font-size: 150px; font-weight: 700; letter-spacing: -.045em; }
    .foot { font-size: 17px; font-weight: 700; letter-spacing: .08em; }
    .stamp text { fill: #d7261e; font-size: 56px; font-weight: 700; letter-spacing: .06em; }
    .bar, .razor { transform-box: fill-box; }
    /* Default styles are the finished state, so reduced motion loses nothing. */
    .bar { transform: scaleX(0); transform-origin: right center; }
    @media (prefers-reduced-motion: no-preference) {
      .razor { transform-origin: left center; animation: cut .55s .35s cubic-bezier(.7,0,.2,1) both; }
      .bar { animation: lift .6s cubic-bezier(.7,0,.2,1) both; }
      .b1 { animation-delay: .85s; }
      .b2 { animation-delay: 1.05s; }
      .stamp { transform-box: fill-box; transform-origin: center; animation: stamp .22s 1.75s cubic-bezier(.3,0,.2,1) both; }
    }
    @keyframes cut { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes lift { from { transform: scaleX(1); } to { transform: scaleX(0); } }
    @keyframes stamp { from { opacity: 0; transform: scale(1.7); } to { opacity: 1; transform: scale(1); } }
  </style>

  <rect width="1200" height="500" fill="#f4f1ea"/>

  <!-- Four-column header -->
  <rect x="48" y="44" width="1104" height="3" fill="#111"/>
  <text class="label" x="48" y="74">FILE</text>
  <text class="value" x="48" y="100">Occams-Razer</text>
  <text class="label" x="324" y="74">OPENED</text>
  <text class="value" x="324" y="100">2023-11-19</text>
  <text class="label" x="600" y="74">OCCUPATION</text>
  <text class="value" x="600" y="100">Photogenic informant</text>
  <text class="label" x="924" y="74">PHOTOGRAPH</text>
  <text class="value" x="924" y="100">Withheld</text>

  <!-- Name, under redaction bars that lift once the razor passes -->
  <text class="name" x="42" y="238">Max</text>
  <text class="name" x="42" y="392">Kirchstein</text>
  <rect class="razor" x="0" y="268" width="1200" height="2" fill="#d7261e"/>
  <rect class="bar b1" x="40" y="118" width="310" height="140" fill="#111"/>
  <rect class="bar b2" x="40" y="274" width="770" height="134" fill="#111"/>

  <g class="stamp">
    <g transform="rotate(-9 1000 345)">
      <rect x="885" y="300" width="230" height="90" fill="none" stroke="#d7261e" stroke-width="6"/>
      <text x="1000" y="365" text-anchor="middle">OPEN</text>
    </g>
  </g>

  <!-- Footer: the razor, with its ending redacted -->
  <rect x="48" y="424" width="1104" height="1" fill="#111"/>
  <text class="foot" x="48" y="462">THE SIMPLEST EXPLANATION IS USUALLY</text>
  <rect x="470" y="447" width="46" height="20" fill="#111"/>
  <rect x="526" y="447" width="84" height="20" fill="#111"/>
  <rect x="620" y="447" width="46" height="20" fill="#111"/>
</svg>
